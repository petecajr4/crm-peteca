  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

<script>
/* APPLE — cores do sistema, claro/escuro automático, cor de destaque escolhível */
(function(){
  function lin(c){c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)}
  function toOklch(hex){
    hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(function(x){return x+x}).join('');
    var r=lin(parseInt(hex.substr(0,2),16)),g=lin(parseInt(hex.substr(2,2),16)),b=lin(parseInt(hex.substr(4,2),16));
    var l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b),m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b),s=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);
    var L=0.2104542553*l+0.793617785*m-0.0040720468*s,A=1.9779984951*l-2.428592205*m+0.4505937099*s,B=0.0259040371*l+0.7827717662*m-0.808675766*s;
    var C=Math.sqrt(A*A+B*B),H=Math.atan2(B,A)*180/Math.PI;if(H<0)H+=360;return [L,C,H];
  }
    /* APPLE — claro/escuro automático + cor de destaque. Mantém os nomes --md-* (todo o app usa) */
  var AP = {
    light: { red:'#E5352B', orange:'#D97100', yellow:'#B88A00', green:'#248A3D', mint:'#0C9A92', teal:'#1E8FA8', cyan:'#0A84C4', blue:'#007AFF', indigo:'#5856D6', purple:'#A647D4', pink:'#E5245A', brown:'#8E6E4E', gray:'#8E8E93' },
    dark:  { red:'#FF453A', orange:'#FF9F0A', yellow:'#FFD60A', green:'#30D158', mint:'#63E6E2', teal:'#40C8E0', cyan:'#64D2FF', blue:'#0A84FF', indigo:'#5E5CE6', purple:'#BF5AF2', pink:'#FF375F', brown:'#AC8E68', gray:'#98989D' }
  };
  var NEU = {
    light: { bg:'#F2F2F7', s1:'#FFFFFF', s2:'#FFFFFF', s3:'#FFFFFF', s4:'#F2F2F7', s5:'#E5E5EA', ov:'#E3E3E8', ol:'#C7C7CC',
             on:'#1D1D1F', on2:'#2C2C2E', onv:'#6E6E73', mut:'#8E8E93', mut2:'#AEAEB2', scrim:'rgba(0,0,0,.28)',
             mat:'rgba(246,246,248,.72)', matThin:'rgba(255,255,255,.6)', edge:'rgba(255,255,255,.7)', shadow:'0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06)', shadowLg:'0 10px 40px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.06)' },
    dark:  { bg:'#000000', s1:'#111113', s2:'#1C1C1E', s3:'#1C1C1E', s4:'#2C2C2E', s5:'#3A3A3C', ov:'#2E2E31', ol:'#48484A',
             on:'#F5F5F7', on2:'#E5E5EA', onv:'#AEAEB2', mut:'#8E8E93', mut2:'#636366', scrim:'rgba(0,0,0,.5)',
             mat:'rgba(28,28,30,.72)', matThin:'rgba(44,44,46,.6)', edge:'rgba(255,255,255,.08)', shadow:'0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3)', shadowLg:'0 16px 48px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4)' }
  };
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  var atual = '#007aff';
  window.applyMdTheme = function (seed) {
    atual = seed || atual;
    var dark = !!(mq && mq.matches), m = dark ? 'dark' : 'light', N = NEU[m];
    var o = toOklch(atual), L = o[0], C = Math.max(o[1], 0.02), H = o[2];
    if (dark) L = Math.max(L, 0.66); else L = Math.min(Math.max(L, 0.5), 0.64);
    var P = function (l, c) { return 'oklch(' + l.toFixed(3) + ' ' + c.toFixed(3) + ' ' + H.toFixed(1) + ')'; };
    var T = function (l, c) { return 'oklch(' + l.toFixed(3) + ' ' + c.toFixed(3) + ' ' + ((H + 40) % 360).toFixed(1) + ')'; };
    var v = {
      bg: N.bg, s1: N.s1, s2: N.s2, s3: N.s3, s4: N.s4, s5: N.s5, ov: N.ov, ol: N.ol,
      on: N.on, on2: N.on2, onv: N.onv, mut: N.mut, mut2: N.mut2,
      p40: P(L - 0.12, C), p45: P(L - 0.08, C), p50: P(L - 0.04, C), p55: P(L, C),
      p75: dark ? P(Math.min(L + 0.1, 0.86), C * 0.8) : P(L - 0.04, C), p85: dark ? P(0.9, C * 0.4) : P(L - 0.1, C),
      pc: P(L, C), onpc: '#FFFFFF',
      t45: T(L - 0.1, C), t50: T(L - 0.06, C), t55: T(L - 0.02, C), t60: T(L, C), t75: dark ? T(Math.min(L + 0.1, 0.86), C * 0.8) : T(L - 0.04, C), t85: dark ? T(0.9, C * 0.4) : T(L - 0.1, C)
    };
    var st = document.documentElement.style, n;
    for (n in v) st.setProperty('--md-' + n, v[n]);
    for (n in AP[m]) st.setProperty('--ap-' + n, AP[m][n]);
    ['scrim', 'mat', 'matThin', 'edge', 'shadow', 'shadowLg'].forEach(function (k) { st.setProperty('--ap-' + k, N[k]); });
    st.setProperty('color-scheme', m);
    document.documentElement.setAttribute('data-tema', m);
    var mt = document.querySelector('meta[name=theme-color]'); if (!mt) { mt = document.createElement('meta'); mt.name = 'theme-color'; document.head.appendChild(mt); } mt.content = N.bg;
  };
  if (mq) { var troca = function () { document.documentElement.classList.add('ap-trocando'); window.applyMdTheme(); setTimeout(function () { document.documentElement.classList.remove('ap-trocando'); }, 400); };
    if (mq.addEventListener) mq.addEventListener('change', troca); else if (mq.addListener) mq.addListener(troca); }
  var seed = '#007aff'; try { seed = localStorage.getItem('peteca_ap_accent') || seed; } catch (e) {}
  window.applyMdTheme(seed);

})();

<script>
/* =====================================================================
   PETECA × SUPABASE — login, sincronização e Kanban na nuvem
   (JS puro, sem bibliotecas; embutido no index.html e no vendedor.html)
   ===================================================================== */
(function () {
  var SB_URL = 'https://ovlcnkvgwbdjmiahpxes.supabase.co';
  var SB_KEY = 'sb_publishable_53fN3cX-brNnzJy6FtRcRA_JaRvn7Sr';
  var DOMINIO = '@crm.peteca';
  var SESS_KEY = 'peteca_sb_session';
  var OLD_API = 'https://script.google.com/macros/s/AKfycbyqtgNDt03Z2cfTlbDAUObosynmHaFvXTW4h76X-p3H55_ZFnkKwqKEi6gwFLI9Er4y/exec';

  function ler(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
  function gravar(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var enc = encodeURIComponent;

  // ------------------------------------------------------------------
  // AUTENTICAÇÃO
  // ------------------------------------------------------------------
  var session = ler(SESS_KEY, null);
  var refreshing = null;
  function salvarSessao(s) { session = s; gravar(SESS_KEY, s); }

  function traduzErro(m) {
    m = String(m || '');
    if (/invalid login credentials/i.test(m)) return 'Nome ou senha incorretos';
    if (/password should be|weak/i.test(m)) return 'Senha fraca: use pelo menos 8 caracteres';
    if (/same.*password|different from the old/i.test(m)) return 'A nova senha precisa ser diferente da atual';
    if (/failed to fetch|networkerror|load failed/i.test(m)) return 'Sem conexão com a nuvem';
    if (/duplicate key|23505/i.test(m)) return 'Cliente já possui Kanban ativo';
    if (/row-level security|42501|permission denied/i.test(m)) return 'Sem permissão para esta ação';
    return m;
  }

  function authPost(path, body, bearer) {
    var h = { apikey: SB_KEY, 'Content-Type': 'application/json' };
    if (bearer) h.Authorization = 'Bearer ' + bearer;
    return fetch(SB_URL + '/auth/v1/' + path, { method: 'POST', headers: h, body: JSON.stringify(body || {}) })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) { var e = new Error(traduzErro(j.error_description || j.msg || j.message || j.error || ('HTTP ' + r.status))); e.auth = true; throw e; }
          return j;
        });
      }, function (e) { throw new Error(traduzErro(e.message)); });
  }

  function guardarToken(j) {
    salvarSessao({
      access_token: j.access_token,
      refresh_token: j.refresh_token,
      expires_at: Date.now() + (j.expires_in || 3600) * 1000,
      user_id: (j.user && j.user.id) || (session && session.user_id),
      perfil: session && session.perfil || null
    });
  }

  function expirou() { salvarSessao(null); window.dispatchEvent(new Event('peteca-sessao-expirada')); }

  function refresh() {
    if (!session || !session.refresh_token) return Promise.reject(new Error('Sessão expirada'));
    if (!refreshing) {
      refreshing = authPost('token?grant_type=refresh_token', { refresh_token: session.refresh_token })
        .then(guardarToken, function (e) { if (e.auth) expirou(); throw e; })
        .then(function () { refreshing = null; }, function (e) { refreshing = null; throw e; });
    }
    return refreshing;
  }

  function token() {
    if (!session) return Promise.resolve(null);
    if (session.expires_at - Date.now() < 120000) return refresh().then(function () { return session && session.access_token; });
    return Promise.resolve(session.access_token);
  }

  function rest(path, opt, jaTentou) {
    opt = opt || {};
    var h = { apikey: SB_KEY, 'Content-Type': 'application/json' };
    if (opt.prefer) h.Prefer = opt.prefer;
    var pTok = opt.anon ? Promise.resolve(null) : token();
    return pTok.then(function (t) {
      if (t) h.Authorization = 'Bearer ' + t;
      return fetch(SB_URL + '/rest/v1/' + path, {
        method: opt.method || 'GET', headers: h,
        body: opt.body !== undefined ? JSON.stringify(opt.body) : undefined
      }).catch(function (e) { throw new Error(traduzErro(e.message)); });
    }).then(function (r) {
      if (r.status === 401 && !jaTentou && session && !opt.anon) {
        return refresh().then(function () { return rest(path, opt, true); });
      }
      return r.text().then(function (txt) {
        var j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = txt; }
        if (!r.ok) throw new Error(traduzErro((j && (j.message || j.hint || j.msg)) || ('HTTP ' + r.status)));
        return j;
      });
    });
  }

  function nomeAtual() { return (session && session.perfil && session.perfil.nome) || '?'; }

  function login(nome, senha) {
    var email = String(nome || '').trim().toLowerCase().replace(/\s+/g, '') + DOMINIO;
    return authPost('token?grant_type=password', { email: email, password: senha }).then(function (j) {
      salvarSessao(null); guardarToken(j);
      return rest('perfis?select=nome,tipo,ativo&user_id=eq.' + session.user_id);
    }).then(function (p) {
      if (!p || !p.length || !p[0].ativo) { return logout().then(function () { throw new Error('Usuário sem perfil ativo. Fale com o administrador.'); }); }
      session.perfil = { nome: p[0].nome, tipo: p[0].tipo };
      salvarSessao(session);
      rest('acessos', { method: 'POST', body: { usuario: p[0].nome, origem: /vendedor/i.test(location.pathname) ? 'vendedor' : 'crm' }, prefer: 'return=minimal' }).catch(function () {});
      return session.perfil;
    });
  }

  function logout() {
    var t = session && session.access_token;
    salvarSessao(null);
    if (!t) return Promise.resolve();
    return fetch(SB_URL + '/auth/v1/logout', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + t } }).catch(function () {});
  }

  function trocarSenha(nova) {
    if (!nova || String(nova).length < 8) return Promise.reject(new Error('Use pelo menos 8 caracteres'));
    return token().then(function (t) {
      return fetch(SB_URL + '/auth/v1/user', { method: 'PUT', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: JSON.stringify({ password: nova }) });
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(traduzErro(j.msg || j.message || j.error_description || 'Erro ao trocar senha'));
        return true;
      });
    });
  }

  window.PetecaSB = {
    url: SB_URL,
    logado: function () { return !!(session && session.access_token && session.perfil); },
    perfil: function () { return session && session.perfil; },
    login: login, logout: logout, trocarSenha: trocarSenha, rest: rest
  };

  // ------------------------------------------------------------------
  // SINCRONIZAÇÃO DOS DADOS DO CRM (IndexedDB local <-> tabela crm_kv)
  // O navegador vira cache; a nuvem é a fonte oficial.
  // ------------------------------------------------------------------
  var SYNC_RE = /^(peteca_crm_clientes|peteca_crm_mods|peteca_crm_vendas_index|peteca_vendas_ano_\d{4}|peteca_anotacoes_clientes|peteca_alias_clientes|peteca_metas|peteca_nao_duplicados|peteca_mesclagens|peteca_carteira_ok|peteca_produtos_cfg)$/;
  var META_KEY = 'peteca_sync_meta', PEND_KEY = 'peteca_sync_pending';
  var meta = ler(META_KEY, {}), pend = ler(PEND_KEY, {}), seq = Date.now();
  var raw = null, flushing = null, timer = null, autoIv = null;
  var estado = { status: 'ok', pendentes: 0, ultimo: ler('peteca_sync_ultimo', null), erro: null };

  function emitir(patch) {
    for (var k in patch) estado[k] = patch[k];
    estado.pendentes = Object.keys(pend).length;
    window.dispatchEvent(new CustomEvent('peteca-sync-status', { detail: Object.assign({}, estado) }));
  }
  function salvarPend() { gravar(PEND_KEY, pend); }
  function salvarMeta() { gravar(META_KEY, meta); }

  function instalar() {
    if (raw || !window.storage) return;
    raw = { get: window.storage.get, set: window.storage.set, del: window.storage.delete, list: window.storage.list };
    window.storage.set = function (k, v) {
      return raw.set(k, v).then(function (r) {
        if (SYNC_RE.test(k) && typeof v === 'string') { pend[k] = { op: 'set', v: ++seq }; salvarPend(); agendar(); }
        return r;
      });
    };
    window.storage.delete = function (k) {
      return raw.del(k).then(function (r) {
        if (SYNC_RE.test(k)) { pend[k] = { op: 'del', v: ++seq }; salvarPend(); agendar(); }
        return r;
      });
    };
  }

  function agendar() {
    emitir({ status: 'pendente' });
    clearTimeout(timer);
    timer = setTimeout(function () { flush().catch(function () {}); }, 1500);
  }

  // junta dois JSON-objeto (mapas por id): remoto + local, campo a campo (local vence). Listas/arrays: null (não junta)
  var conflitos = [];
  function juntar(remotoStr, localStr) {
    try {
      var a = JSON.parse(remotoStr), b = JSON.parse(localStr);
      var obj = function (x) { return x && typeof x === 'object' && !Array.isArray(x); };
      if (!obj(a) || !obj(b)) return null;
      var o = {}, k;
      for (k in a) o[k] = a[k];
      for (k in b) o[k] = (obj(a[k]) && obj(b[k])) ? Object.assign({}, a[k], b[k]) : b[k];
      return JSON.stringify(o);
    } catch (e) { return null; }
  }

  function flush(onProg) {
    if (flushing) return flushing;
    if (!window.PetecaSB.logado()) return Promise.resolve();
    var chaves = Object.keys(pend);
    if (!chaves.length) { emitir({ status: 'ok' }); return Promise.resolve(); }
    emitir({ status: 'enviando' });
    var i = 0;
    flushing = (function proximo() {
      if (i >= chaves.length) return Promise.resolve();
      var k = chaves[i++], item = pend[k];
      if (!item) return proximo();
      var p;
      if (item.op === 'del') {
        p = rest('crm_kv?key=eq.' + enc(k), { method: 'DELETE' }).then(function () { delete meta[k]; });
      } else {
        p = raw.get(k).then(function (r) {
          if (!r || typeof r.value !== 'string') return;
          // v13: outro computador alterou esta chave desde o último download? junta antes de enviar
          var pRemoto = meta[k] ? rest('crm_kv?select=value,updated_at,updated_by&key=eq.' + enc(k)) : Promise.resolve(null);
          return pRemoto.then(function (rr) {
            var valor = r.value;
            if (rr && rr[0] && rr[0].updated_at !== meta[k]) {
              var junto = juntar(rr[0].value, r.value);
              if (junto !== null) { valor = junto; conflitos.push({ k: k, por: rr[0].updated_by, junto: true }); }
              else conflitos.push({ k: k, por: rr[0].updated_by, junto: false });
            }
            return (valor !== r.value ? raw.set(k, valor) : Promise.resolve()).then(function () {

      var i = 0;
      function baixar() {
        if (i >= fila.length) return Promise.resolve();
        var x = fila[i++];
        return rest('crm_kv?select=value,updated_at&key=eq.' + enc(x.key)).then(function (r) {
          if (r && r[0]) return raw.set(x.key, r[0].value).then(function () { meta[x.key] = r[0].updated_at; mudou.push(x.key); });
        }).then(baixar);

          return rest('carteira?on_conflict=cliente_id', { method: 'POST', prefer: 'resolution=merge-duplicates,return=minimal',
            body: g.map(function (x) { return { cliente_id: String(x.cliente_id), vendedor: x.para, desde: agora, por: por }; }) });
